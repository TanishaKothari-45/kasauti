[project]
name = "kasauti"
version = "0.1.0"
description = "Break, measure and grade voice agents with realistic Indian callers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "audiomentations>=0.37",
  "soundfile>=0.12",
  "numpy>=1.26",
  "jiwer>=3.0",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13.9",
]

[project.scripts]
kasauti = "kasauti.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasauti"]
