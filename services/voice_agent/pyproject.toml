[project]
name = "voice-agent"
version = "0.1.0"
description = "The clinic receptionist: a Pipecat voice pipeline with swappable stacks."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[webrtc,runner,silero,local-smart-turn,mlx-whisper,whisper,kokoro,google,groq,sarvam,tracing]>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "google-genai>=2.0",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
